# --- 1. BACKEND (Django) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conference-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conference
      tier: backend
  template:
    metadata:
      labels:
        app: conference
        tier: backend
    spec:
      securityContext: # Безопасность на уровне Пода
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: backend
        image: ghcr.io/sinfulstvr/sci-conf-final-backend:latest
        ports:
        - containerPort: 8000
        securityContext: # Безопасность на уровне контейнера
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: conference
    tier: backend
  ports:
  - port: 80
    targetPort: 8000
---
# --- 2. FRONTEND (React) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conference-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conference
      tier: frontend
  template:
    metadata:
      labels:
        app: conference
        tier: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: frontend
        image: ghcr.io/sinfulstvr/sci-conf-final-frontend:latest
        ports:
        - containerPort: 80
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: conference
    tier: frontend
  ports:
  - port: 80
    targetPort: 80
---
# --- 3. INGRESS (Исправленный) ---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: conference-ingress
spec:
  ingressClassName: nginx # Вместо устаревшей аннотации
  rules:
  - host: sci-conf-sinful-stvr.dyn.cloud.e-infra.cz
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
---
# --- 4. NETWORK POLICY ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-policy
spec:
  podSelector:
    matchLabels:
      app: conference
      tier: backend
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: conference
          tier: frontend
    ports:
    - protocol: TCP
      port: 8000